<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="580" height="200" viewBox="0 0 580 200" role="img">
<defs>
<style>
text{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;}
.mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,Menlo,monospace;}
.t{fill:#E8EEF9;} .m{fill:#93A1C0;} .d{fill:#56637F;}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite;}
.flowslow{stroke-dasharray:3 9;animation:flow 2.4s linear infinite;}
@keyframes flow{to{stroke-dashoffset:-28;}}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes pulse{0%,100%{opacity:.25;}50%{opacity:1;}}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
</style>
<linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1022"/><stop offset="1" stop-color="#060A14"/></linearGradient>
<radialGradient id="glowA" cx=".85" cy=".1" r=".7"><stop offset="0" stop-color="#A78BFA" stop-opacity=".16"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx=".05" cy=".95" r=".6"><stop offset="0" stop-color="#22D3EE" stop-opacity=".12"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1E2A4D"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>

</defs>
<rect x=".5" y=".5" width="579" height="199" rx="18" fill="url(#bgg)" stroke="#1E2A4D"/>
<rect x=".5" y=".5" width="579" height="199" rx="18" fill="url(#glowA)"/>
<rect x=".5" y=".5" width="579" height="199" rx="18" fill="url(#glowB)"/>


