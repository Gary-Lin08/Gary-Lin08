<style>
text{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;}
.mono{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,Menlo,monospace;}
.t{fill:#E8EEF9;} .m{fill:#93A1C0;} .d{fill:#56637F;}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite;}
.flowslow{stroke-dasharray:3 9;animation:flow 2.4s linear infinite;}
